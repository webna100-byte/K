<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout</title>
<style>
html, body { margin: 0; padding: 0; background: #fff; color-scheme: light; }
.app-splash { position: fixed; inset: 0; background: #fff; display: flex; align-items: center; justify-content: center; z-index: 99999; }
.app-splash img { max-width: 130px; max-height: 130px; object-fit: contain; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="css/style.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="css/style.css"></noscript>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
</head>
<body>
  <div class="app-splash" id="appSplash"><img id="splashLogo" alt="" style="display:none;"></div>
  <header id="site-header"></header>
  <main class="page-content">
    <h1 id="pageTitle" style="margin-bottom:8px;"></h1>
    <div id="deliveryNotice" class="mini-note" style="margin-bottom:16px;"></div>

    <div class="order-type-tabs">
      <button class="order-type-btn active" id="pickupTab"><i data-lucide="shopping-bag"></i><span id="pickupLabel"></span></button>
      <button class="order-type-btn" id="deliveryTab"><i data-lucide="truck"></i><span id="deliveryLabel"></span></button>
    </div>

    <form id="checkoutForm">
      <div class="admin-card">
        <h3 id="infoTitle"></h3>
        <div class="form-group">
          <label id="nameLabel"></label>
          <input type="text" id="custName" required>
        </div>
        <div class="form-group">
          <label id="phoneLabel"></label>
          <input type="tel" id="custPhone" required>
        </div>
        <div class="form-group" id="zoneGroup" style="display:none;">
          <label id="zoneLabel"></label>
          <select id="custZone"></select>
        </div>
        <div class="form-group" id="locationGroup" style="display:none;">
          <label id="locationLabel"></label>
          <input type="text" id="custLocation">
        </div>
        <div class="form-group">
          <label id="notesLabel"></label>
          <textarea id="custNotes" class="notes-field"></textarea>
        </div>
      </div>

      <div class="admin-card">
        <h3 id="summaryTitle"></h3>
        <div id="orderSummary"></div>
        <div class="row" style="display:flex;justify-content:space-between;font-weight:800;font-size:1.05rem;margin-top:10px;">
          <span id="totalLabel"></span><span id="totalValue"></span>
        </div>
      </div>

      <button type="submit" class="btn-primary" id="sendBtn"><i data-lucide="send"></i> <span></span></button>
    </form>
  </main>
  <footer id="site-footer"></footer>

  <script src="js/store.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
