<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>&#8203;</title>
<link rel="manifest" href="/manifest.webmanifest">
<style>
html,body{margin:0;background:#fff}
.app-splash{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:99999;font-family:system-ui,sans-serif}
.app-splash img{max-width:120px;max-height:120px;object-fit:contain;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
</style>
<script>
(function(){try{var l=localStorage.getItem('site_lang');if(!l){var c=JSON.parse(localStorage.getItem('site_cache_v2')||'null');l=c&&c.config&&c.config.settings.defaultLang==='en'?'en':'ar'}document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr'}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/icons.js"></script>
</head>
<body data-page="levels" class="member">
<div class="app-splash" id="appSplash"><img id="splashLogo" alt=""></div>
<script>(function(){try{var s=localStorage.getItem('site_logo');var i=document.getElementById('splashLogo');if(s)i.src=s;else i.remove()}catch(e){}})();</script>
<header id="site-header"></header>
<main id="main" class="member-page"></main>
<footer id="site-footer"></footer>
<nav id="bottom-nav"></nav>
<script src="/js/pricing.js"></script><script src="/js/i18n.js"></script><script src="/js/store.js"></script><script src="/js/firebase.js"></script><script src="/js/ui.js"></script><script src="/js/pages.js"></script>
</body>
</html>
