<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Admin Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/icons.js"></script>
</head>
<body class="admin-body">
  <div class="admin-login-wrap">
    <form class="admin-login-card" id="loginForm">
      <i data-lucide="lock-keyhole" style="width:40px;height:40px;color:var(--accent);margin-bottom:10px"></i>
      <h1>Admin Panel</h1>
      <div class="form-group" style="text-align:start"><label for="password">Password</label><input type="password" id="password" required autofocus autocomplete="current-password"></div>
      <button type="submit" class="btn-primary" id="loginBtn">Sign in</button>
      <p id="errorMsg" class="form-error hidden" style="margin-top:12px"></p>
      <a href="/" class="mini-note" style="display:block;margin-top:16px">← Back to website</a>
    </form>
  </div>
  <script src="/js/pricing.js"></script><script src="/js/i18n.js"></script><script src="/js/store.js"></script><script src="/js/firebase.js"></script><script src="/js/ui.js"></script>
  <script>
  window.FORCE_LANG = 'en';
  (async () => {
    renderIcons();
    try { await Store.load({ fresh: true }); applyTheme(); await StaffAuth.init(); if (StaffAuth.role() === 'admin') location.replace('/admin/'); } catch (e) { console.error(e); }
    const form = document.getElementById('loginForm'), err = document.getElementById('errorMsg'), btn = document.getElementById('loginBtn');
    form.addEventListener('submit', async e => {
      e.preventDefault();
      err.classList.add('hidden'); btn.disabled = true;
      try {
        const { token } = await api('/api/auth/admin', { method: 'POST', body: { password: document.getElementById('password').value } });
        await StaffAuth.signInWithToken(token);
        location.href = '/admin/';
      } catch (ex) {
        console.error(ex);
        err.textContent = ex.message === 'invalid_login' ? 'Wrong password' : ex.message === 'too_many_attempts' ? 'Too many attempts. Wait 10 minutes.' : 'Sign-in failed: ' + ex.message;
        err.classList.remove('hidden'); btn.disabled = false;
      }
    });
  })();
  </script>
</body>
</html>
