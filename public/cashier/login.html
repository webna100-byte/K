<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Cashier</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/icons.js"></script>
</head>
<body class="admin-body">
  <div class="admin-login-wrap">
    <form class="admin-login-card" id="loginForm">
      <img id="logo" alt="" style="height:64px;margin:0 auto 10px;display:none">
      <h1 id="title"></h1>
      <div class="form-group" style="text-align:start"><label for="username" id="uLabel"></label><input type="text" id="username" required autocapitalize="none" autocomplete="username" dir="ltr"></div>
      <div class="form-group" style="text-align:start"><label for="password" id="pLabel"></label><input type="password" id="password" required autocomplete="current-password" dir="ltr"></div>
      <button type="submit" class="btn-primary" id="loginBtn"></button>
      <p id="errorMsg" class="form-error hidden" style="margin-top:12px"></p>
      <button type="button" class="lang-toggle" id="langBtn" style="margin-top:16px"></button>
    </form>
  </div>
  <script src="/js/pricing.js"></script><script src="/js/i18n.js"></script><script src="/js/store.js"></script><script src="/js/firebase.js"></script><script src="/js/ui.js"></script>
  <script>
  (async () => {
    applyDocDir();
    const $ = id => document.getElementById(id);
    $('title').textContent = t('cashier_login'); $('uLabel').textContent = t('username'); $('pLabel').textContent = t('password'); $('loginBtn').textContent = t('login'); $('langBtn').textContent = t('lang_switch_full');
    $('langBtn').addEventListener('click', () => { setLang(getLang() === 'ar' ? 'en' : 'ar'); location.reload(); });
    try { await Store.load({ fresh: true }); applyTheme(); if (Store.data && Store.data.settings.logo) { $('logo').src = Store.data.settings.logo; $('logo').style.display = 'block'; } await StaffAuth.init(); if (StaffAuth.role() === 'cashier') location.replace('/cashier/'); } catch (e) { console.error(e); }
    $('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const err = $('errorMsg'), btn = $('loginBtn');
      err.classList.add('hidden'); btn.disabled = true;
      try {
        const { token } = await api('/api/auth/cashier', { method: 'POST', body: { username: $('username').value, password: $('password').value } });
        await StaffAuth.signInWithToken(token);
        location.href = '/cashier/';
      } catch (ex) {
        err.textContent = ex.message === 'too_many_attempts' ? t('too_many_attempts') : t('invalid_login');
        err.classList.remove('hidden'); btn.disabled = false;
      }
    });
  })();
  </script>
</body>
</html>
